plugins {
    id 'com.android.test'
    id 'org.jetbrains.kotlin.android'
}

/**
 * Baseline Profile 生成模块。
 *
 * ## 它是什么
 *
 * Android 运行时会在安装/后台闲时用 baseline profile 做**预编译（AOT）**，
 * 让冷启动与首屏走已编译好的代码，而不是边解释边 JIT。
 *
 * 仓库里原本已有 `assets/dexopt/baseline.prof` —— 那是 AGP 从**依赖库自带的**
 * profile 里合成的（Compose、OkHttp 等都会贡献）。它覆盖的是库代码，
 * **完全没有本应用自己的类**。这个模块补的就是这一段：把「冷启动 → 首页 → 课表」
 * 这条真实路径上的类与方法记录下来，生成本应用自己的 profile。
 *
 * ## 为什么是独立模块
 *
 * `com.android.test` 模块不能与应用模块合并：profile 生成要跑 **instrumented test**，
 * 而应用模块的 androidTest 会被打进被测 APK、影响被测对象本身（体积、启动路径）。
 * 单独一个模块可以让应用保持"什么都没多"，profile 只作为产物回流。
 *
 * ## 怎么用
 *
 * ```
 * # 用本机已连接的设备（最快）
 * ./gradlew :baselineprofile:connectedBenchmarkAndroidTest
 *
 * # 或用 Gradle Managed Device（无需真机，会自动起模拟器）
 * ./gradlew :baselineprofile:pixel6Api34BenchmarkAndroidTest
 * ```
 *
 * 产物在 `app/src/main/baselineProfiles/baseline-prof.txt`，
 * 下次 `assembleRelease` 会自动合并进 APK。
 *
 * ⚠️ **没有合适的设备就生成不出来** —— 这不是配置问题，是这类工具的本质：
 * profile 记录的是真实运行轨迹，只能跑出来，不能写出来。
 *
 * ## 本机实测结论（2026-10-18，MuMu 模拟器）
 *
 * 设备：MuMu，`ro.build.type=user`、`ro.build.tags=release-keys`、SDK 35、x86_64。
 *
 * ### 已验证「能」的部分
 *
 * **APK 内嵌的 baseline profile 会被系统接受并用于 AOT 编译。** 实测：
 *
 *  1. `am broadcast -a androidx.profileinstaller.action.INSTALL_PROFILE` →
 *     `ProfileInstaller: RESULT_INSTALL_SUCCESS`；
 *  2. 随后 `cmd package compile -m speed-profile -f <pkg>` 成功；
 *  3. `cmd package dump <pkg>` 显示 `status=speed-profile`（不是 `verify`）。
 *
 * 也就是说 **profile 文件本身是有效的、打包链路是通的** —— 这一点已确认。
 *
 * ### 已验证「不能」的部分
 *
 * 生成**本应用自己的** profile 需要采集运行轨迹，而本机：
 *
 *  1. `am profile start --sampling 1000 <pid> <path>` 被拒
 *     （`IllegalArgumentException: Unknown process`）—— 这是 benchmark 的采样通道；
 *  2. `/data/misc/profiles/cur/0/<pkg>/` **无读取权限**（user 版正常限制），
 *     所以也拿不到运行期 profile 来导出。
 *
 * 结论：**采集不了轨迹，就写不出属于本应用的 profile**。
 * 换设备后不需要改任何代码：
 *
 *  - 一台 `userdebug` 真机（`ro.build.type=userdebug`）→
 *    `./gradlew :baselineprofile:connectedBenchmarkAndroidTest`
 *  - 或 AOSP 官方 system-image 的模拟器（非厂商定制 ROM）
 *
 * 生成后产物落在 `app/src/main/baselineProfiles/baseline-prof.txt`，
 * 下次 `assembleRelease` 会自动合并进 APK 的 `assets/dexopt/baseline.prof`。
 *
 * ### 顺带确认的一件好事
 *
 * 即便没有本应用自己的 profile，现有 APK 里的 `baseline.prof` 也**不是空的**：
 * 它由 AGP 从依赖库自带的 profile 合成（Compose、OkHttp 等都会贡献），
 * 实测能让系统把 dexopt 从 `verify` 提升到 `speed-profile`。
 * 所以"没有自定义 profile"不等于"完全没有 profile 收益"。 */
android {
    namespace 'com.hnnujw.course.baselineprofile'
    compileSdk 37

    defaultConfig {
        minSdk 24
        // 与 app 模块的 targetSdk 对齐，否则装不上被测应用。
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    targetProjectPath = ':app'
    // 不启用这个变体：我们只要 profile，不需要一个可独立安装的测试包。
    experimentalProperties['android.experimental.self-instrumenting'] = true

    // 测试 APK 必须**签名**才能装到设备上。
    //
    // 首次跑 connectedBenchmarkAndroidTest 时报了
    // `INSTALL_PARSE_FAILED_NO_CERTIFICATES` —— `com.android.test` 模块默认不签名，
    // 而这台设备是 user 版（ro.debuggable=0），不接受未签名的包。
    //
    // 复用 app 模块同款兜底 keystore（~/.android/debug.keystore）：它只是测试包，
    // 不发布、不校验身份，用 debug 签名完全够。
    signingConfigs {
        benchmarkSigning {
            def fallback = file("${System.getProperty("user.home")}/.android/debug.keystore")
            if (fallback.exists()) {
                storeFile fallback
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        create('benchmark') {
            debuggable = true
            // profile 采集要求被分析的应用是可 profile 的；AGP 会自动配。
            matchingFallbacks = ['release']
            signingConfig signingConfigs.benchmarkSigning
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    testOptions {
        managedDevices {
            localDevices {
                // 只用一台设备：多机型会让 profile 变成并集，收益不如"在主流机型上准"。
                // API 34 与本项目 targetSdk 35 的下限最接近，且 system-image 已有。
                create('pixel6Api34') {
                    device = 'Pixel 6'
                    apiLevel = 34
                    systemImageSource = 'aosp'
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.3.4'
}
