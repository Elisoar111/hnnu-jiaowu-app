# Windows 中文路径（如 D:\测试\...）下必须用 file.encoding=COMPAT，不要写死 UTF-8。
# 原因：Gradle 用 Charset.defaultCharset() 生成测试 worker 的 @argfile
# （org.gradle.internal.process.ArgWriter 里是 new PrintWriter(File)，走默认字符集），
# 而 JDK 启动器 java.exe 展开 @argfile 时用的是系统 ANSI 码页（简中 Windows = GBK/936）。
# 写死 UTF-8 会让两侧不一致：classpath 里的中文目录被错读成乱码（如“测试”→“娴嬭瘯”），
# 测试 worker 找不到类，:app:testDebugUnitTest 全部报 ClassNotFoundException。
# COMPAT = 跟随本机系统编码，写入与读取自动一致（路径全 ASCII 的机器上同样正确）。
# stdout/stderr 单独保持 UTF-8，避免构建日志里的中文变成乱码。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=COMPAT -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8
# Kotlin 编译跑在独立 daemon 里，显式钉住 UTF-8，保证源码里的中文字面量不受影响。
kotlin.daemon.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.overridePathCheck=true
android.suppressUnsupportedCompileSdk=37.0
org.gradle.configuration-cache=true
