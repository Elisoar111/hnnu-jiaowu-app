name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号，如 v1.0.67。留空则沿用当前 ref（从 tag 页面手动触发时可留空）'
        required: false
        default: ''
      release_notes:
        description: '更新日志（每行一条）。留空则读 release-notes/<tag>.md'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
      release_tag: ${{ steps.target.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 需要完整历史与 tag 列表，后面要判断目标 tag 是否已存在。
          fetch-depth: 0

      # 发布目标 tag 是一个显式概念，不再从 github.ref 隐式推断。
      #
      # 三种触发方式统一到同一个 tag 上：
      #   1. push tag            → github.ref_name 就是 tag
      #   2. 从 tag 页面手动触发  → 同上，inputs.tag 可留空
      #   3. 从分支手动触发      → 必须给 inputs.tag，随后由本工作流建 tag
      #
      # 没有 tag 就不能发布：Gitee 的下载地址是按 tag 拼的，缺 tag 会产出死链。
      - name: Resolve Release Target
        id: target
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            echo "Trigger: ref is a tag -> $TAG"
          elif [ -n "${INPUT_TAG:-}" ]; then
            TAG="${INPUT_TAG}"
            echo "Trigger: manual dispatch from ${GITHUB_REF_NAME} -> $TAG"
          else
            echo "ERROR: 从分支手动触发时必须填写 tag 输入（如 v1.0.67）。"
            echo "       Gitee 下载地址按 tag 拼接，缺 tag 只会产出死链。"
            exit 1
          fi

          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "ERROR: tag 形如 vX.Y.Z，收到: $TAG"; exit 1 ;;
          esac

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # 更新日志的唯一数据源是 release-notes/<tag>.md 的 "## notes" 区块。
      # 手动触发（workflow_dispatch）时 inputs.release_notes 优先，用于补发或临时改文案。
      #
      # 这一步同时替掉了原先的死锁：release_notes 只在 workflow_dispatch 有值，
      # 而写 Gitee 的 job 又要求 ref 是 tag，两条路径互斥，于是文案永远写不进去。
      - name: Resolve Release Notes
        id: notes
        env:
          # 经 env 传入而不是把 ${{ }} 直接插值进脚本：后者会让输入里的引号
          # 或换行改变脚本本身的结构。
          MANUAL_NOTES: ${{ github.event.inputs.release_notes }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail

          NOTES_FILE="release-notes/${TAG}.md"

          if [ -n "${MANUAL_NOTES:-}" ]; then
            echo "Source: workflow_dispatch input"
            NOTES="$MANUAL_NOTES"
          elif [ -f "$NOTES_FILE" ]; then
            echo "Source: $NOTES_FILE"
            # 抽取实现只有一份：scripts/release_notes.sh，scripts/release.sh 与
            # scripts/publish.py 用的都是它。这里原先内联了同一段 awk/sed ——
            # 三份实现一旦漂开，本地校验通过的文案到了 CI 就变成另一段，而这段文案
            # 会被应用当纯文本逐行显示，多一行少一行用户都看得见。
            NOTES="$(bash -c 'source scripts/release_notes.sh; extract_notes "$1"' _ "$NOTES_FILE")"
          else
            # 这里不再回落到套话。缺日志就是发布准备没做完，
            # 与其静默发一版"自动构建发布"给所有用户，不如让流水线停下。
            echo "ERROR: 找不到 $NOTES_FILE，且没有手动输入。"
            echo "       请先补 release-notes/${TAG}.md 的 '## notes' 区块，或在手动触发时填写更新日志。"
            exit 1
          fi

          if [ -z "$NOTES" ]; then
            echo "ERROR: 解析出的更新日志为空（检查 '## notes' 区块是否有内容）"
            exit 1
          fi

          echo "--- resolved release notes ---"
          echo "$NOTES"

          # 多行值必须走 heredoc 形式的 GITHUB_OUTPUT，单行 echo 会在第一个换行处截断。
          {
            echo 'release_notes<<RELEASE_NOTES_EOF'
            echo "$NOTES"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # 版本号的唯一权威是 tag，不是 app/version.properties。
      #
      # 这里原先是反过来的：文件是权威，CI 只做一致性校验，而那个校验还排在
      # assembleRelease 之后。于是"打了 tag 但忘了改文件"每次都要等编译完一整轮
      # 才报错，而这个仓库的规矩是已推送的 tag 不移动（见 CHANGELOG 里 1.0.67
      # 那条），一次手滑就得跳一个版本号。
      #
      # 改成从 tag 反写之后，"版本与 tag 不一致"在结构上不可能发生——tag 是用户
      # 下载的东西，也就是唯一有意义的权威。校验没了，只剩推导。
      # scripts/release.sh 负责让仓库里的文件与 tag 同步；这一步是兜底，
      # 保证手动打 tag 也发不出版本号与 tag 不符的包。
      - name: Resolve Version From Tag
        id: version
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail

          VN="${TAG#v}"
          MAJOR="${VN%%.*}"
          REST="${VN#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"

          for PART in "$MAJOR" "$MINOR" "$PATCH"; do
            case "$PART" in
              ''|*[!0-9]*) echo "ERROR: 从 ${TAG} 解析出的版本段不是数字: '${PART}'"; exit 1 ;;
            esac
          done

          # versionCode = major*10000 + minor*100 + patch（1.2.2 → 10202）。
          # 旧方案"versionCode = patch 位"只对 1.0.x 成立：1.2.2 按 patch 位是 2，
          # 而线上 1.2.1 已经是 91，下一个版本会算出比 91 还小的 code，用户端永远升不上去。
          VC=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          # 应用内比较的是 versionCode。它一旦不增，用户就会收到一个永远
          # "更新不掉"的提示。拿除自己以外最高的那个 tag 做基准，这样重跑
          # 同一版本（补发、上次 Gitee 上传失败）不会被自己挡住。
          PREV=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | grep -vFx "$TAG" \
            | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1 || true)

          if [ -n "${PREV:-}" ]; then
            # 旧 tag 的 code 也按新公式重算：仓库里 1.1.x / 1.2.x 的 code 是顺手 +1
            # 加出来的（91、92…），直接拿来比会把 10202 误判成没增。
            PREV_MAJOR="${PREV%%.*}"
            PREV_REST="${PREV#*.}"
            PREV_MINOR="${PREV_REST%%.*}"
            PREV_PATCH="${PREV_REST#*.}"
            PREV_CODE=$(( PREV_MAJOR * 10000 + PREV_MINOR * 100 + PREV_PATCH ))
            if [ "$VC" -le "$PREV_CODE" ]; then
              echo "ERROR: 版本号没有递增：${TAG} 算出 ${VC}，上一个 tag v${PREV} 是 ${PREV_CODE}。"
              echo "       三段数字必须整体往前走（tag 本身也不能回退）。"
              exit 1
            fi
            echo "上一个版本 v${PREV}（code ${PREV_CODE}）-> ${TAG}（code ${VC}）"
          fi

          # 仓库里的文件与 tag 不一致不再是错误，只是信息：手动打 tag 时它会落后，
          # 而构建用的是下面写进去的这份。
          REPO_VN=$(sed -n 's/^VERSION_NAME=[[:space:]]*//p' app/version.properties | tr -d '[:space:]' || true)
          if [ "${REPO_VN:-}" != "$VN" ]; then
            echo "NOTE: 仓库里的 version.properties 是 ${REPO_VN:-<空>}，按 tag 覆盖为 ${VN}。"
            echo "      下次用 scripts/release.sh ${VN} 发版可以让文件一起对齐。"
          fi

          cat > app/version.properties <<PROPS
          #Release version. 唯一权威是 git tag：本文件由 CI 从 tag 反写
          #（.github/workflows/release.yml 的 Resolve Version From Tag）。
          #不要手改：跑 scripts/release.sh X.Y.Z，它会连更新日志和 tag 一起对齐。
          VERSION_NAME=${VN}
          VERSION_CODE=${VC}
          PROPS

          cat app/version.properties

          echo "version_code=${VC}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VN}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 正式发布签名。四个 secret 必须齐全且互相对应，否则下面的构建会被
      # app/build.gradle 里那道 GradleException 直接终止（这是刻意设计：
      # 与其静默发出一个 debug 签名、老用户覆盖安装失败的包，不如让流水线停下）。
      #
      #   KEYSTORE_BASE64            app/release-key.jks 的 base64（不要带换行）
      #   RELEASE_STORE_PASSWORD     keystore 口令
      #   RELEASE_KEY_ALIAS          别名（当前为 hnnujw-release）
      #   RELEASE_KEY_PASSWORD       该别名对应的口令（PKCS12 下与 store 口令相同）
      #
      # 生成 base64：base64 -w0 app/release-key.jks
      #
      # ⚠️ 换密钥时**必须**同步改 scripts/publish.py 里的 EXPECTED_CERT_SHA256，
      #    否则本地 publish.py 会把这个新包当成"签名证书不对"而拒绝上传。
      # ⚠️ 2026-09-24 之前这几个 secret 形同虚设：当时 app/release-key.jks 根本不存在，
      #    releaseKeystoreFile == null 让那道闸门永远不触发，hasReleaseSigning 恒为 false，
      #    于是静默走了 build.gradle 的「缺正式签名就退回 debug keystore」兜底 ——
      #    线上 v1.2.4 / v1.2.5 的 app-release.apk 实测就是 debug 签名（keytool -printcert
      #    与本机 ~/.android/debug.keystore 证书一致）。别再让 secret 空着。
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-key.jks
          if [ ! -s app/release-key.jks ]; then
            echo "ERROR: app/release-key.jks 是空的 —— KEYSTORE_BASE64 这个 secret 没配。"
            echo "       空文件同样会让 releaseKeystoreFile != null 而 hasReleaseSigning 为 false，"
            echo "       闸门会拦住构建；但报错信息不如这里直白，所以先在这里停。"
            exit 1
          fi
          echo "keystore 已就位：$(wc -c < app/release-key.jks) 字节"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check App and Build APKs
        env:
          RELEASE_SIGNING_CONFIG_FILE: release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin
          :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleUiPreview
          --no-parallel --max-workers=2 --console=plain


      - name: Upload Check Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-check-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload version.properties
        uses: actions/upload-artifact@v4
        with:
          name: version-info
          path: app/version.properties
          retention-days: 3

      # 从分支手动触发时 tag 还不存在，而 Gitee 的下载地址按 tag 拼接，
      # 所以必须在发布前把 tag 建出来，否则产出的是死链。
      # 已存在则跳过：重跑同一版本是常见操作（补发、上次 Gitee 上传失败），不该因此报错。
      - name: Ensure Tag Exists
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} 已存在于仓库，跳过创建"
            exit 0
          fi

          echo "Tag ${TAG} 不存在，基于 ${GITHUB_SHA} 创建"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          echo "Tag ${TAG} 已推送"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          # 显式给 tag：手动触发时 github.ref 是分支，不指定会把 Release 挂错位置。
          tag_name: ${{ steps.target.outputs.tag }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          name: Release ${{ steps.target.outputs.tag }}
          body: |
            感谢使用校园助理！

            **更新日志：**
            ${{ steps.notes.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3

  sync-to-gitee:
    needs: build
    runs-on: ubuntu-latest
    # 不再按 github.ref 判断。上游已保证 tag 存在，无论触发方式如何都要同步，
    # 否则手动触发只编译不发布，用户侧永远收不到更新。
    #
    # Gitee 仓库不再写死：优先读仓库变量 GITEE_REPO（Settings → Secrets and
    # variables → Actions → Variables，形如 owner/repo）。未设置时回退到
    # 本项目仓库（Elisoar/hnnu-jiaowu-app）。
    env:
      GITEE_REPO: ${{ vars.GITEE_REPO || 'Elisoar/hnnu-jiaowu-app' }}
    steps:
      - name: Checkout Code (for version.properties)
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./apk

      - name: Download Version Info
        uses: actions/download-artifact@v4
        with:
          name: version-info
          path: ./version

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          # 从 build job 承接，与 GitHub Release 用的是同一份文案和同一个 tag。
          RELEASE_NOTES: ${{ needs.build.outputs.release_notes }}
          TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -e

          # job env 的 GITEE_REPO（仓库变量，回退原仓库）拼出 API 地址
          # api/v5/repos/<repo>，创建 Release 与上传附件都走它。
          GITEE_REPO_API="gitee.com/api/v5/repos/${GITEE_REPO}"

          APK_FILE=$(find ./apk -name "*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file not found in artifact"
            exit 1
          fi

          if [ -z "${RELEASE_NOTES:-}" ]; then
            echo "ERROR: 上游未传出更新日志，中止同步（不写空文案覆盖线上 Release 正文）"
            exit 1
          fi

          # 从构建产物 version.properties 读取真实版本号。
          # 与 build job 用同一种锚定写法：文件里有注释行，子串 grep 会把注释
          # 一起收进来，而 cut 对不含 '=' 的行会吐回整行。
          VERSION_CODE=$(sed -n 's/^VERSION_CODE=[[:space:]]*//p' ./version/version.properties | tr -d '[:space:]')
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=[[:space:]]*//p' ./version/version.properties | tr -d '[:space:]')

          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "ERROR: 无法从产物解析版本号（VC='${VERSION_CODE}' VN='${VERSION_NAME}'）"
            exit 1
          fi

          echo "=== Syncing to Gitee ==="
          echo "TAG: $TAG"
          echo "VERSION_NAME: $VERSION_NAME"
          echo "VERSION_CODE: $VERSION_CODE"
          echo "APK: $APK_FILE ($(du -h "$APK_FILE" | cut -f1))"

          # 1. 创建或复用 Gitee Release
          echo ""
          echo "--- Step 1: Gitee Release ---"

          # 先检查是否已存在
          EXISTING_RELEASE=$(curl -s "https://${GITEE_REPO_API}/releases?access_token=${GITEE_TOKEN}&per_page=50" | \
            jq -r "[.[] | select(.tag_name==\"${TAG}\")] | .[0].id // empty")

          if [ -n "$EXISTING_RELEASE" ]; then
            echo "Release already exists (ID: $EXISTING_RELEASE), will upload APK to it"
            RELEASE_ID="$EXISTING_RELEASE"
          else
            echo "Creating new release..."
            RELEASE_RESPONSE=$(curl -s -X POST \
              "https://${GITEE_REPO_API}/releases" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "tag_name=${TAG}" \
              -F "name=Release ${TAG}" \
              -F "target_commitish=main" \
              -F "body=${RELEASE_NOTES}" \
              -F "prerelease=false")
            RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id // empty')
            if [ -z "$RELEASE_ID" ]; then
              echo "WARNING: Failed to create release:"
              echo "$RELEASE_RESPONSE" | jq .
            else
              echo "Release created (ID: $RELEASE_ID)"
            fi
          fi

          # 2. 上传 APK 到 Release
          echo ""
          echo "--- Step 2: Upload APK ---"

          if [ -n "$RELEASE_ID" ]; then
            # 检查是否已有同名附件
            EXISTING_ASSET=$(curl -s "https://${GITEE_REPO_API}/releases/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}" | \
              jq -r '[.[] | select(.name=="app-release.apk")] | .[0].id // empty')

            if [ -n "$EXISTING_ASSET" ]; then
              echo "APK asset already exists (ID: $EXISTING_ASSET), skipping upload"
            else
              echo "Uploading APK..."
              UPLOAD_RESPONSE=$(curl -s -X POST \
                "https://${GITEE_REPO_API}/releases/${RELEASE_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${APK_FILE}")
              UPLOAD_URL=$(echo "$UPLOAD_RESPONSE" | jq -r '.browser_download_url // empty')
              if [ -n "$UPLOAD_URL" ]; then
                echo "APK uploaded: $UPLOAD_URL"
              else
                echo "WARNING: Upload response:"
                echo "$UPLOAD_RESPONSE" | jq .
              fi
            fi
          else
            echo "ERROR: No release ID, cannot upload APK"
          fi

          echo "=== Gitee sync complete ==="

      - name: Verify Gitee Delivery
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          # 与上面 Sync to Gitee 同一个仓库变量，保证校验的是同一个仓库。
          GITEE_REPO: ${{ vars.GITEE_REPO || 'Elisoar/hnnu-jiaowu-app' }}
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_verify_delivery.py'
          python3 scripts/verify_delivery.py --tag "${{ needs.build.outputs.release_tag }}"
