plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ============ 自动版本号迭代 ============
def versionPropsFile = file('version.properties')
def versionProps = new Properties()

if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
} else {
    versionProps['VERSION_CODE'] = '1'
    versionProps['VERSION_NAME'] = '1.0.0'
}

def code = versionProps['VERSION_CODE'].toInteger()
def name = versionProps['VERSION_NAME']
def localSecrets = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localSecrets.load(new FileInputStream(localPropertiesFile))
}

def readSecret = { String envName, String propertyName = envName ->
    def envValue = System.getenv(envName)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue.trim()
    }

    def propertyValue = localSecrets.getProperty(propertyName)
    if (propertyValue != null && !propertyValue.trim().isEmpty()) {
        return propertyValue.trim()
    }

    return null
}

def quoteForBuildConfig = { String value ->
    "\"" + value.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
}

// 版本号完全由 version.properties 静态控制，发版前由开发者手动修改并 commit
// 不再在构建时自动自增，避免 CI 容器中的改动无法同步回 Git 仓库导致版本锁死

def isReleaseTask = gradle.startParameter.taskNames.any { taskName ->
    def lower = taskName.toLowerCase()
    (lower.contains('release') && (lower.contains('assemble') || lower.contains('bundle')))
}

println "📦 当前版本: versionCode=$code, versionName=$name (isRelease=$isReleaseTask)"

def releaseKeystoreFile = System.getenv("RELEASE_SIGNING_CONFIG_FILE") != null
    ? file(System.getenv("RELEASE_SIGNING_CONFIG_FILE"))
    : (file('release-key.jks').exists() ? file('release-key.jks') : null)
def releaseStorePassword = readSecret("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = readSecret("RELEASE_KEY_ALIAS")
def releaseKeyPassword = readSecret("RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystoreFile != null &&
    releaseStorePassword != null &&
    releaseKeyAlias != null &&
    releaseKeyPassword != null

if (releaseKeystoreFile != null && isReleaseTask && !hasReleaseSigning) {
    throw new GradleException("Release signing credentials are missing. Configure RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD via environment variables or local.properties.")
}

android {
    namespace 'com.hnnujw.course'
    compileSdk 37

    defaultConfig {
        // 包名已于 1.2.2 切换：1.2.1 及之前是 com.tyust.course（旧包名，停止更新），
        // 1.2.2 起统一为 com.hnnujw.course。
        // 安卓把包名当作应用身份，两个包名互相独立、无法覆盖升级，所以老用户必须
        // 手动下载新版安装一次；这一步靠应用内公告 + 更新弹窗引导，别改回去。
        applicationId "com.hnnujw.course"
        minSdk 24
        /**
         * targetSdk 34 → 35（Android 15）。
         *
         * 升级前逐项核查过 Android 15 的强制变更，本项目的适配情况：
         *
         *  1. **edge-to-edge 强制**：已经是 edge-to-edge 了 —— 所有 15 个 Activity
         *     都经过 `CourseSelectorTheme`，那里统一调了
         *     `WindowCompat.setDecorFitsSystemWindows(window, false)` 并把两个系统栏
         *     设成透明；页面侧有 46 处 insets 处理（statusBarsPadding 等）。
         *     所以这条变更对本项目**没有实际影响**，不会出现内容被系统栏盖住。
         *  2. **前台服务类型强制**：本应用**没有**任何前台服务（`startForeground` 零命中），
         *     不涉及。
         *  3. **16 KB page size**：APK 里唯一的 native so 是
         *     `libandroidx.graphics.path.so`，实测 PT_LOAD 对齐已经是 16384，满足要求。
         *  4. **`MIXED_CONTENT_NEVER_ALLOW` 收紧**：已经在 2.3 那批里按站点 scheme
         *     分别处理（见 `web/WebViewMixedContent`），不依赖 targetSdk 的默认值。
         *  5. **`SYSTEM_ALERT_WINDOW` 收紧**：本项目不用悬浮窗权限，不涉及。
         *
         * 保留 34 到 35 的跳跃而不是直接跳 36：Android 16 还有"自适应布局强制"
         * （大屏忽略屏幕方向锁）需要单独验证，分两次升便于定位问题。
         */
        targetSdk 35
        versionCode code
        versionName name
        buildConfigField "boolean", "UI_PREVIEW", "false"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 本地出包兜底：没有正式签名配置时退回 debug keystore。
    // 否则 assembleRelease 只产出 app-release-unsigned.apk，装不上，
    // 每次都得手工补签（而且下一次 packageRelease 还会把它删掉）。
    //
    // ⚠️ 2026-09-24 审计结论：这条兜底曾经不是"本地便利"而是"线上现实"。
    //    keytool -printcert 比对过：Gitee 上 v1.2.4 / v1.2.5 的 app-release.apk
    //    与本机 ~/.android/debug.keystore 的证书 SHA-256 完全相同，
    //    也就是说发到用户手机上的包其实全是 debug 密钥签的。
    //    原因是 release-key.jks 一直不存在、local.properties 也没有三个口令，
    //    hasReleaseSigning 恒为 false，于是下面第 66 行那道 GradleException 闸门
    //    因 releaseKeystoreFile == null 而根本没机会触发，静默走了兜底。
    //    另一层后果更麻烦：debug keystore 是每台机器各生成一把，换台机器构建就会
    //    产出不同签名的包，用户无法覆盖安装。
    //    现已改为真实密钥签名（app/release-key.jks + local.properties 三个键）。
    //    这段兜底只保留为"确实没凭据时本地还能自测"的最后手段；
    //    发布侧另有一道独立的闸门：scripts/publish.py 会校验包内证书指纹必须等于
    //    EXPECTED_CERT_SHA256，debug 签名的包一律拒绝上传。
    def fallbackStore = file("${System.getProperty("user.home")}/.android/debug.keystore")
    def hasFallbackSigning = !hasReleaseSigning && fallbackStore.exists()

    if (hasFallbackSigning) {
        println "⚠️  未找到正式签名凭据：release 将由 debug keystore 签名（仅供本地自测，禁止发布）。"
        println "    补凭据：把 release-key.jks 放到 app/ 下，并在 local.properties 填"
        println "    RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD。"
    }

    signingConfigs {
        // 内置 debug 签名也要 v1：Debug 包同样会被发给别人装，
        // Android 7.0 以下装 v2-only 的包会报「安装包解析失败/损坏」。
        debug {
            enableV1Signing true
            enableV2Signing true
        }
        release {
            if (hasReleaseSigning) {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else if (hasFallbackSigning) {
                storeFile fallbackStore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
            // 三代签名全开：minSdk 24 时 AGP 默认只签 v2，Android 7.0 以下的设备
            // 无法验证 v2-only 的包，安装时会报「安装包解析失败/损坏」。补上 v1
            // 兜住老设备，v3 兜住密钥轮换场景。
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            // 资源收缩：R8 已经把代码里的无用部分裁掉，但 res/ 下的图片/布局
            // 不会自动跟着走。开启后会把"没有任何代码引用"的资源一并移除。
            //
            // 前提是 minifyEnabled 也为 true（否则 AGP 会拒绝），这里已满足。
            // 安全性已核查：全仓没有 `getResources().getIdentifier(...)` 这类
            // 按名字动态取资源的写法 —— 那才是资源收缩唯一的真实风险
            // （名字是运行时拼的，静态分析看不到引用，会把还在用的资源删掉）。
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning || hasFallbackSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
        uiPreview {
            initWith debug
            applicationIdSuffix '.uipreview'
            versionNameSuffix '-ui-preview'
            matchingFallbacks = ['debug']
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "UI_PREVIEW", "true"
        }
        // 性能验证变体：与 release 同为 R8 优化产物，但独立包名、debug 签名、可 profile，
        // 专门用来量「混淆+优化之后」的真实帧时间（release 包不可 profile，量不了）。
        //
        // 它没有默认执行者，必须显式指定，用法（2026-09-24 实测可用，
        // assembleBenchmark 4m38s 出 app-benchmark.apk）：
        //   ./gradlew :app:assembleBenchmark                     # 只出包
        //   ./gradlew :app:assembleBenchmarkAndroidTest -PuiTestBuildType=benchmark
        //                                                        # 用 release 优化产物跑仪器测试
        // 为什么必须带 -PuiTestBuildType：testBuildType 默认是 debug（见下面 testBuildType），
        // 而性能类仪器测试都带 assumeTrue(BuildConfig.UI_PREVIEW)，默认变体下会被整批跳过。
        // buildType 里 UI_PREVIEW=true 就是为了让这批测试在 benchmark 变体下真的执行。
        //
        // 配套：app/benchmark-rules.pro 保住 androidx.tracing / Compose Recomposer，
        // 否则 R8 会把仪器读帧/重组指标要用的类裁掉；app/src/benchmark/AndroidManifest.xml
        // 声明 <profileable android:shell="true"/> 供 Perfetto/Macrobenchmark 采样。
        benchmark {
            initWith release
            proguardFile 'benchmark-rules.pro'
            applicationIdSuffix '.benchmark'
            versionNameSuffix '-benchmark'
            matchingFallbacks = ['release']
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "UI_PREVIEW", "true"
        }
    }
    testBuildType providers.gradleProperty('uiTestBuildType').getOrElse('debug')
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // 显式声明源码编码：javac 不指定时可能落到 JVM 默认字符集，
        // 而上面 gradle.properties 用了 file.encoding=COMPAT（跟随系统，简中=GBK），
        // 不钉住的话 Java 源码里的中文会被错读。
        encoding "UTF-8"
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        buildConfig true
        compose true
    }


    testOptions {
        // CourseParser 等被测类内部调用 android.util.Log，JVM 单测返回默认值而非抛异常
        unitTests.returnDefaultValues = true
        // Robolectric 跑 SQLite 需要真实资源与 manifest（主题、数据库路径等）。
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    
    // Jetpack Compose BOM (Bill of Materials)
    def composeBom = platform('androidx.compose:compose-bom:2026.01.00')
    implementation composeBom
    
    // Compose UI
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    
    // 这里原来有一行 `androidx.navigation:navigation-compose:2.7.7`，2026-09-24 删除。
    // 依据：全仓 app/src 搜 NavHost / rememberNavController / androidx.navigation 零命中，
    // dependencyInsight 显示没有任何其它库要求 navigation（那一行就是整棵依赖树的根），
    // R8 早已把 androidx.navigation.* 全部裁掉（usage.txt 222 条、mapping.txt 0 条），
    // 所以它对发布包体积零影响，占的只是 debug 包与编译 classpath。
    // 之所以要删而不是留着：2.7.7 与 Compose BOM 2026.01（Compose 1.9 系）差两个大版本，
    // 而 BOM 与 kotlin.plugin.compose 都不能降——哪天有人真写 NavHost，就会拿 2.7.7 的 API
    // 去接 1.9 的 Compose。本项目导航靠 Activity + Tab 枚举，不需要导航库。
    // 将来真要引入：直接上当前最新版，别把 2.7.7 捡回来。

    // Compose Debug Tools
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    uiPreviewImplementation 'androidx.compose.ui:ui-test-manifest'
    
    // Legacy Material (for transition period)
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // HTML Parsing
    implementation 'org.jsoup:jsoup:1.15.3'
    implementation 'com.squareup.okio:okio:3.6.0'
    
    // Async (Coroutines for Compose)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    // Modern UI & Animations
    implementation 'com.airbnb.android:lottie-compose:6.3.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Fragments (for gradual migration)
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    
    // CircleImageView for avatar (legacy)
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    
    // GridLayout for schedule (legacy)
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    
    // Coil for image loading in Compose
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // EXIF 取向（自定义图片壁纸导入时正过来）。一条路径覆盖 minSdk 24+，
    // 不必在 ImageDecoder(28+) 与已废弃的 android.media.ExifInterface 之间分叉。
    // 版本跟随 Coil 已传递引入的那一档，避免多解析出一个副本。
    implementation 'androidx.exifinterface:exifinterface:1.3.6'

    // Markdown Rendering for Compose
    implementation "com.halilibo.compose-richtext:richtext-commonmark:0.17.0"
    implementation "com.halilibo.compose-richtext:richtext-ui-material3:0.17.0"

    // Liquid Glass (Kyant Backdrop) — iOS 26 风格折射 / 色散
    implementation 'io.github.kyant0:backdrop:2.0.0'
    implementation 'io.github.kyant0:shapes:1.2.0'

    // 二维码：第二课堂的签到码是 qutuo:// 明文载荷，需要"扫码"与"出示码"两个方向。
    // zxing-android-embedded 自带 CaptureActivity（含运行时权限申请），且**不依赖
    // Google Play 服务** —— ML Kit 那条路在无 GMS 的国行机上会直接不可用。
    // 它内部已传递引入 com.google.zxing:core，生成二维码用同一个 core。
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // 仪器测试：验证 API 31/32 折射所依赖的平台行为，以及离屏 GL 真的出图。
    // test-only，不进发布 APK。
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // org.json 在 JVM 单测中来自 android.jar 桩(默认抛异常), 补真实实现供单元测试使用
    testImplementation 'org.json:json:20231013'

    // Robolectric：让 SQLite 层（ReviewDatabase）能在 JVM 上跑真实建表/查询/迁移。
    // 只作测试依赖，不进发布包。版本钉在 4.14.x —— 它支持到 SDK 35，够本项目用
    // （compileSdk 37 只是编译目标，测试用 @Config(sdk = [34]) 跑）。
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}

/**
 * 覆盖率统计（JaCoCo）。
 *
 * 为什么值得配：项目有 1300+ 个单测，但"哪些地方没测"一直只能靠人工比对文件数
 * 来猜。覆盖率报告让缺口自己浮出来 —— 尤其是 `network/` 这种"要改它之前
 * 必须先有测试"的模块，先看清现状再动手。
 *
 * 用法：`./gradlew :app:jacocoTestReport`
 * 报告：`app/build/reports/jacoco/jacocoTestReport/html/index.html`
 *
 * 只统计 JVM 单测（`testDebugUnitTest`）。仪器测试要真机，合并覆盖率
 * 的成本（设备依赖 + 报告合并）远高于收益，这次不做。
 *
 * ⚠️ 覆盖率高不等于测得对：这里只是"哪些代码完全没被执行过"的地图，
 * 断言质量仍然只能靠人看测试代码。
 */
apply plugin: 'jacoco'

jacoco {
    // 与 AGP 8.13 配套的版本；不用 latest（报告格式与 Gradle 版本耦合）。
    toolVersion = '0.8.12'
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    group = 'verification'
    description = '生成 JVM 单测覆盖率报告（HTML + XML）'

    // 只统计生产代码。排除 R 与 BuildConfig —— 它们是生成的，算进来会稀释真实覆盖率。
    def excludes = [
        '**/R.class', '**/R$*.class', '**/BuildConfig.*',
        '**/Manifest*.*', '**/*Test*.*',
        // Compose 的编译器插件会生成大量合成类，统计它们没有意义。
        '**/ui/**/*Kt*Composable*.*',
    ]

    // 兼容 AGP 8.x 的产物路径（新版把 debug 类放在 intermediates/javac 下，
    // 旧版在 tmp/kotlin-classes）。两处都登记，缺的那个 Gradle 会自己忽略。
    classDirectories.setFrom(
        files(
            fileTree("${buildDir}/tmp/kotlin-classes/debug") { exclude excludes },
            fileTree("${buildDir}/intermediates/javac/debug/classes") { exclude excludes }
        )
    )
    sourceDirectories.setFrom(files("${projectDir}/src/main/java"))
    // 多个测试任务可能都产出 exec，跑多少收多少。
    executionData.setFrom(
        fileTree(buildDir) {
            include '**/*.exec', '**/jacoco/testDebugUnitTest.exec'
        }
    )

    reports {
        xml.required.set(true)
        html.required.set(true)
        csv.required.set(false)
    }
}
